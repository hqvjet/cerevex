name: User Service CI (Hello World)

on:
  push:
    paths:
      - 'services/user-service/**'
      - '.github/workflows/services-user.yml'
  pull_request:
    paths:
      - 'services/user-service/**'
      - '.github/workflows/services-user.yml'

concurrency:
  group: user-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hello:
    name: Hello user-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Say hello
        shell: bash
        run: |
          echo "Hello from user-service"
          echo "Repo: $GITHUB_REPOSITORY | SHA: $GITHUB_SHA"
          echo "Listing contents of services/user-service:"
          ls -la services/user-service || true
