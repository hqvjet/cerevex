name: Third-Party Service CI (Hello World)

on:
  push:
    paths:
      - 'services/third-party-service/**'
      - '.github/workflows/services-third-party.yml'
  pull_request:
    paths:
      - 'services/third-party-service/**'
      - '.github/workflows/services-third-party.yml'

concurrency:
  group: third-party-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hello:
    name: Hello third-party-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Say hello
        shell: bash
        run: |
          echo "Hello from third-party-service"
          echo "Repo: $GITHUB_REPOSITORY | SHA: $GITHUB_SHA"
          echo "Listing contents of services/third-party-service:"
          ls -la services/third-party-service || true
