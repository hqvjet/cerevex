name: AI Service CI (Hello World)

on:
  push:
    paths:
      - 'services/ai-service/**'
      - '.github/workflows/services-ai.yml'
  pull_request:
    paths:
      - 'services/ai-service/**'
      - '.github/workflows/services-ai.yml'

concurrency:
  group: ai-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hello:
    name: Hello ai-service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Say hello
        shell: bash
        run: |
          echo "Hello from ai-service"
          echo "Repo: $GITHUB_REPOSITORY | SHA: $GITHUB_SHA"
          echo "Listing contents of services/ai-service:"
          ls -la services/ai-service || true
